name: Deploy to GitHub Pages

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout legalize-es data
        uses: actions/checkout@v4
        with:
          repository: legalize-dev/legalize-es
          path: legalize-es
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build static data
        working-directory: app
        env:
          LAWS_DIR: ../legalize-es/spain
        run: npm run build:static
      - name: Validate site
        working-directory: app
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
